<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智能选址推荐 - 区域推荐</title>
    <link rel="stylesheet" href="/static/lib/ol/ol.css" />
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
      .wrap { display: flex; flex-direction: column; height: 100%; }
      #map { flex: 1; min-height: 0; }
      header { padding: 10px 12px; border-bottom: 1px solid #eee; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      header input, header select { padding: 6px; border: 1px solid #ddd; border-radius: 6px; }
      header button { padding: 6px 10px; border: none; background: #1677ff; color: #fff; border-radius: 6px; cursor: pointer; }
      header button:disabled { background: #9db9ff; cursor: not-allowed; }

      /* 需求解析面板 */
      #parsePanel {
        display: none;
        padding: 10px 12px;
        background: #f8f9fa;
        border-bottom: 1px solid #eee;
        font-size: 13px;
      }
      #parsePanel.show { display: block; }
      .parse-section { margin-bottom: 8px; }
      .parse-title { font-weight: 600; color: #333; margin-right: 8px; }
      .parse-tag {
        display: inline-block;
        padding: 2px 8px;
        margin: 2px 4px 2px 0;
        background: #e6f4ff;
        border: 1px solid #91caff;
        border-radius: 4px;
        color: #1677ff;
        font-size: 12px;
      }
      .parse-tag.negative { background: #fff2f0; border-color: #ffccc7; color: #ff4d4f; }
      .parse-tag.constraint { background: #fff7e6; border-color: #ffd591; color: #fa8c16; }

      /* 权重条 */
      .weight-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .weight-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .weight-label { color: #666; font-size: 12px; }
      .weight-value {
        display: inline-block;
        min-width: 60px;
        height: 8px;
        background: #e8e8e8;
        border-radius: 4px;
        overflow: hidden;
      }
      .weight-fill {
        height: 100%;
        background: linear-gradient(90deg, #1677ff, #69b1ff);
        border-radius: 4px;
      }
      .weight-pct { font-size: 12px; color: #1677ff; font-weight: 600; min-width: 36px; }

      /* 侧边栏 */
      .sidebar {
        position: absolute;
        right: 12px;
        top: 120px;
        width: 380px;
        max-height: calc(100% - 132px);
        overflow: auto;
        background: #fff;
        border: 1px solid #eee;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0,0,0,.08);
        padding: 12px;
      }
      .sidebar h3 { margin: 0 0 10px 0; font-size: 15px; }

      /* 区域卡片 */
      .site-card {
        border: 1px solid #f0f0f0;
        border-radius: 8px;
        padding: 0;
        margin-bottom: 8px;
        transition: all 0.2s;
        overflow: hidden;
      }
      .site-card:hover { border-color: #1677ff; box-shadow: 0 2px 8px rgba(22,119,255,0.15); }
      .site-card.expanded { border-color: #1677ff; }
      .site-summary {
        display: flex;
        align-items: center;
        padding: 10px 12px;
        cursor: pointer;
        gap: 8px;
        user-select: none;
      }
      .site-summary:hover { background: #f0f5ff; }
      .site-toggle {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #999;
        font-size: 12px;
        transition: transform 0.2s;
        flex-shrink: 0;
      }
      .site-card.expanded .site-toggle { transform: rotate(90deg); color: #1677ff; }
      .site-name { font-weight: 600; font-size: 14px; color: #333; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .site-score {
        background: #1677ff;
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .site-detail {
        display: none;
        padding: 0 12px 12px 12px;
        border-top: 1px solid #f0f0f0;
      }
      .site-card.expanded .site-detail { display: block; }

      /* 区域信息 */
      .area-info {
        display: flex;
        gap: 12px;
        margin: 8px 0;
        font-size: 12px;
        color: #666;
      }
      .area-info-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .area-info-value {
        font-weight: 600;
        color: #333;
      }

      /* 评分表格 */
      .score-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin: 8px 0;
      }
      .score-table th, .score-table td {
        padding: 4px 6px;
        text-align: center;
        border: 1px solid #f0f0f0;
      }
      .score-table th { background: #fafafa; color: #666; font-weight: 500; }
      .score-table td { color: #333; }
      .score-table .highlight { color: #1677ff; font-weight: 600; }

      /* 优势风险分析 */
      .site-analysis { margin-top: 10px; }
      .analysis-section { margin-bottom: 8px; }
      .analysis-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
      .adv-title { color: #52c41a; }
      .risk-title { color: #ff4d4f; }
      .analysis-list {
        margin: 0;
        padding-left: 18px;
        font-size: 12px;
        line-height: 1.6;
      }
      .adv-list li { color: #389e0d; }
      .risk-list li { color: #cf1322; }
      .no-data { color: #999; font-size: 12px; }
      .hint { color: #999; font-size: 12px; }

      /* 区域图例 */
      .area-legend {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(255,255,255,0.95);
        padding: 10px 14px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        font-size: 12px;
        z-index: 100;
      }
      .area-legend-title {
        font-weight: 600;
        margin-bottom: 6px;
        color: #333;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .legend-color {
        width: 24px;
        height: 12px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <input id="requirements" type="text" placeholder="请输入选址需求，例如：四会市工业用地，交通便利，避开生态敏感区" style="flex:1;min-width:300px" />
        <select id="region">
          <option value="all">全部区域</option>
          <option value="台山市">台山市</option>
          <option value="四会市">四会市</option>
          <option value="五华县">五华县</option>
        </select>
        <button id="runBtn">生成推荐</button>
        <input id="placeSearch" type="text" placeholder="搜索地名" style="width:180px" />
        <button id="searchBtn">搜索</button>
      </header>

      <!-- 需求解析面板 -->
      <div id="parsePanel">
        <div class="parse-section">
          <span class="parse-title">需求拆解:</span>
          <span id="parsedReqs"></span>
        </div>
        <div class="parse-section">
          <span class="parse-title">指标权重:</span>
          <div class="weight-bar" id="weightBar"></div>
        </div>
      </div>

      <div id="map">
        <!-- 区域图例 -->
        <div class="area-legend" id="areaLegend" style="display:none;">
          <div class="area-legend-title">推荐区域</div>
          <div class="legend-item">
            <div class="legend-color" style="background:rgba(22,119,255,0.35);border:2px solid #1677ff;"></div>
            <span>高评分区域</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background:rgba(22,119,255,0.15);border:2px solid #69b1ff;"></div>
            <span>中评分区域</span>
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar" id="sidebar" hidden>
      <h3>推荐区域</h3>
      <div id="list"></div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "rbush": "/static/lib/rbush/index.js"
      }
    }
    </script>

    <script type="module">
      import OlMap from '/static/lib/ol/Map.js';
      import View from '/static/lib/ol/View.js';
      import TileLayer from '/static/lib/ol/layer/Tile.js';
      import VectorLayer from '/static/lib/ol/layer/Vector.js';
      import XYZ from '/static/lib/ol/source/XYZ.js';
      import VectorSource from '/static/lib/ol/source/Vector.js';
      import {fromLonLat} from '/static/lib/ol/proj.js';
      import Feature from '/static/lib/ol/Feature.js';
      import Point from '/static/lib/ol/geom/Point.js';
      import Polygon from '/static/lib/ol/geom/Polygon.js';
      import Style from '/static/lib/ol/style/Style.js';
      import Fill from '/static/lib/ol/style/Fill.js';
      import Stroke from '/static/lib/ol/style/Stroke.js';
      import CircleStyle from '/static/lib/ol/style/Circle.js';
      import GeoJSON from '/static/lib/ol/format/GeoJSON.js';

      let map = null;
      let vectorSource = null;
      let hasMap = false;
      let searchMarker = null;
      const geojsonFormat = new GeoJSON();

      // 五维度名称映射
      const DIM_NAMES = {
        eco_safety: '生态安全',
        pop_economy: '人口经济',
        resource_env: '资源环境',
        spatial_dev: '空间发展',
        urban_quality: '城市质量'
      };
      const DIM_ORDER = ['eco_safety', 'pop_economy', 'resource_env', 'spatial_dev', 'urban_quality'];

      async function initMap() {
        vectorSource = new VectorSource();
        try {
          const base = new TileLayer({
            source: new XYZ({ url: '/tiles/img/{z}/{x}/{y}', crossOrigin: 'anonymous' })
          });
          const labels = new TileLayer({
            source: new XYZ({ url: '/tiles/cia/{z}/{x}/{y}', crossOrigin: 'anonymous' })
          });
          const areaLayer = new VectorLayer({
            source: vectorSource,
            style: function(feature) {
              const score = feature.get('score') || 5;
              const idx = feature.get('index') || 1;
              const isSelected = feature.get('selected');
              // Color by score: higher = more opaque blue
              const alpha = 0.15 + (score / 10) * 0.35;
              const strokeAlpha = isSelected ? 1 : 0.7;
              const strokeWidth = isSelected ? 3 : 2;
              return new Style({
                fill: new Fill({ color: `rgba(22, 119, 255, ${alpha})` }),
                stroke: new Stroke({ color: `rgba(22, 119, 255, ${strokeAlpha})`, width: strokeWidth })
              });
            }
          });
          map = new OlMap({
            target: 'map',
            layers: [base, labels, areaLayer],
            view: new View({ center: fromLonLat([112.7, 23.2]), zoom: 9 })
          });

          // Click on polygon to highlight and show card
          map.on('click', function(evt) {
            const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
            if (feature && feature.get('index')) {
              const idx = feature.get('index');
              const card = document.querySelector(`.site-card[data-index="${idx}"]`);
              if (card) {
                // Scroll to card
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                // Expand if not expanded
                if (!card.classList.contains('expanded')) {
                  card.classList.add('expanded');
                }
                // Highlight polygon
                vectorSource.getFeatures().forEach(f => f.set('selected', false));
                feature.set('selected', true);
              }
            }
          });

          // Pointer cursor on polygon hover
          map.on('pointermove', function(evt) {
            if (evt.dragging) return;
            const hit = map.hasFeatureAtPixel(evt.pixel);
            map.getTargetElement().style.cursor = hit ? 'pointer' : '';
          });

          hasMap = true;
        } catch (e) {
          console.warn('地图初始化失败：', e);
        }
      }
      initMap();

      // Render GeoJSON polygon features
      function renderPolygons(features) {
        if (!hasMap) return;
        vectorSource.clear();

        features.forEach(f => {
          const olFeat = geojsonFormat.readFeature(f, {
            dataProjection: 'EPSG:4326',
            featureProjection: 'EPSG:3857'
          });
          vectorSource.addFeature(olFeat);
        });
      }

      // 渲染需求解析面板
      function renderParsePanel(data) {
        const panel = document.getElementById('parsePanel');
        const parsedReqs = document.getElementById('parsedReqs');
        const weightBar = document.getElementById('weightBar');

        // 渲染子需求
        let reqsHtml = '';
        const pr = data.parsed_requirements || {};

        (pr.positive || []).forEach(r => {
          if (r) reqsHtml += `<span class="parse-tag">${r}</span>`;
        });
        (pr.negative || []).forEach(r => {
          if (r) reqsHtml += `<span class="parse-tag negative">排除: ${r}</span>`;
        });

        parsedReqs.innerHTML = reqsHtml || '<span class="hint">无法解析</span>';

        // 渲染权重条 - 5维度
        const weights = data.weights || {};
        let weightHtml = '';

        DIM_ORDER.forEach(key => {
          const w = weights[key];
          if (w) {
            const pct = Math.round(w.value * 100);
            weightHtml += `
              <div class="weight-item">
                <span class="weight-label">${w.name}</span>
                <div class="weight-value"><div class="weight-fill" style="width:${pct}%"></div></div>
                <span class="weight-pct">${pct}%</span>
              </div>
            `;
          }
        });

        weightBar.innerHTML = weightHtml;
        panel.classList.add('show');
      }

      // 渲染区域列表
      function renderList(sites, weights) {
        const list = document.getElementById('list');
        list.innerHTML = '';

        const arr = Object.keys(sites || {})
          .sort((a, b) => Number(a) - Number(b))
          .map(k => sites[k]);

        arr.forEach((s, i) => {
          const card = document.createElement('div');
          card.className = 'site-card';
          card.dataset.index = s.site_index !== undefined ? s.site_index + 1 : i + 1;

          const score = s.score ? s.score.toFixed(2) : '-';
          const name = s.name || '未命名区域';
          const shortName = name.length > 25 ? name.substring(0, 25) + '...' : name;

          // 五维度评分
          const sd = s.score_details || {};

          // 优势和风险
          const advList = Array.isArray(s.advantages) ? s.advantages : [];
          const riskList = Array.isArray(s.risks) ? s.risks : [];

          let advHtml = advList.length > 0
            ? '<ul class="analysis-list adv-list">' + advList.map(a => `<li>${a}</li>`).join('') + '</ul>'
            : '<span class="no-data">暂无</span>';

          let riskHtml = riskList.length > 0
            ? '<ul class="analysis-list risk-list">' + riskList.map(r => `<li>${r}</li>`).join('') + '</ul>'
            : '<span class="no-data">暂无</span>';

          // 折叠摘要行
          const summary = document.createElement('div');
          summary.className = 'site-summary';
          summary.innerHTML = `
            <span class="site-toggle">&#9654;</span>
            <span class="site-name">${i+1}. ${shortName}</span>
            <span class="site-score">${score}分</span>
          `;

          // 展开详情区域
          const detail = document.createElement('div');
          detail.className = 'site-detail';
          detail.innerHTML = `
            <div class="area-info">
              <div class="area-info-item">乡镇: <span class="area-info-value">${s.township || '-'}</span></div>
              <div class="area-info-item">面积: <span class="area-info-value">${s.area_km2 || '-'} km2</span></div>
              <div class="area-info-item">网格数: <span class="area-info-value">${s.grid_count || '-'}</span></div>
            </div>
            <table class="score-table">
              <tr>
                ${DIM_ORDER.map(k => `<th>${DIM_NAMES[k]}</th>`).join('')}
              </tr>
              <tr>
                ${DIM_ORDER.map(k => {
                  const d = sd[k] || {};
                  const val = d.normalized || 0;
                  return `<td class="${val >= 7 ? 'highlight' : ''}">${d.desc || '-'}</td>`;
                }).join('')}
              </tr>
            </table>
            <div class="site-analysis">
              <div class="analysis-section">
                <div class="analysis-title adv-title">优势</div>
                ${advHtml}
              </div>
              <div class="analysis-section">
                <div class="analysis-title risk-title">风险</div>
                ${riskHtml}
              </div>
            </div>
          `;

          // 点击摘要行切换展开/折叠
          summary.onclick = (e) => {
            e.stopPropagation();
            const isExpanded = card.classList.contains('expanded');
            card.classList.toggle('expanded');
            // 在地图上定位该区域
            if (!isExpanded && hasMap && s.center_lon && s.center_lat) {
              map.getView().animate({
                center: fromLonLat([+s.center_lon, +s.center_lat]),
                zoom: 12,
                duration: 400
              });
              // Highlight this polygon
              vectorSource.getFeatures().forEach(f => f.set('selected', false));
              const idx = s.site_index !== undefined ? s.site_index + 1 : i + 1;
              vectorSource.getFeatures().forEach(f => {
                if (f.get('index') === idx) f.set('selected', true);
              });
            }
          };

          card.appendChild(summary);
          card.appendChild(detail);
          list.appendChild(card);
        });

        document.getElementById('sidebar').hidden = false;
      }

      async function run() {
        const btn = document.getElementById('runBtn');
        btn.disabled = true;
        btn.textContent = '生成中...';
        if (hasMap) vectorSource.clear();

        document.getElementById('parsePanel').classList.remove('show');
        document.getElementById('sidebar').hidden = true;
        document.getElementById('areaLegend').style.display = 'none';

        const payload = {
          requirements: document.getElementById('requirements').value,
          region: document.getElementById('region').value,
          top_k: 5
        };

        try {
          const resp = await fetch('/api/recommendations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await resp.json();

          if (data.error) throw new Error(data.error);

          // 渲染需求解析面板
          renderParsePanel(data);

          // 渲染多边形区域
          if (hasMap) {
            renderPolygons(data.features || []);
            if (data.center) {
              map.getView().animate({
                center: fromLonLat([data.center.lon, data.center.lat]),
                zoom: 10,
                duration: 300
              });
            }
          }

          // 渲染区域列表
          if (data.sites) {
            renderList(data.sites, data.weights);
            document.getElementById('areaLegend').style.display = 'block';
          }

        } catch (e) {
          alert('服务错误: ' + e.message);
        } finally {
          btn.disabled = false;
          btn.textContent = '生成推荐';
        }
      }

      window.run = run;
      document.getElementById('runBtn').onclick = run;
      document.getElementById('requirements').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') run();
      });

      // 地名搜索
      async function searchPlace() {
        const q = document.getElementById('placeSearch').value.trim();
        if (!q) return;
        try {
          const resp = await fetch(`/api/geocode?q=${encodeURIComponent(q)}`);
          const r = await resp.json();
          if (!resp.ok || r.error) {
            alert('未找到匹配地点');
            return;
          }
          const lon = parseFloat(r.lon), lat = parseFloat(r.lat);
          if (hasMap) {
            if (searchMarker) vectorSource.removeFeature(searchMarker);
            const feat = new Feature({ geometry: new Point(fromLonLat([lon, lat])) });
            feat.setStyle(new Style({
              image: new CircleStyle({ radius: 10, fill: new Fill({ color: '#ff4d4f' }), stroke: new Stroke({ color: '#fff', width: 2 }) })
            }));
            vectorSource.addFeature(feat);
            searchMarker = feat;
            map.getView().animate({ center: fromLonLat([lon, lat]), zoom: 13, duration: 400 });
          }
        } catch (e) {
          alert('搜索失败：' + e.message);
        }
      }

      document.getElementById('searchBtn').onclick = searchPlace;
      document.getElementById('placeSearch').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchPlace();
      });
    </script>
  </body>
</html>
