<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智能选址推荐 - 地图展示</title>
    <link rel="stylesheet" href="/static/lib/ol/ol.css" />
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
      .wrap { display: flex; flex-direction: column; height: 100%; }
      #map { flex: 1; min-height: 0; }
      header { padding: 10px 12px; border-bottom: 1px solid #eee; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      header input, header select { padding: 6px; border: 1px solid #ddd; border-radius: 6px; }
      header button { padding: 6px 10px; border: none; background: #1677ff; color: #fff; border-radius: 6px; cursor: pointer; }
      header button:disabled { background: #9db9ff; cursor: not-allowed; }
      
      /* 需求解析面板 */
      #parsePanel { 
        display: none; 
        padding: 10px 12px; 
        background: #f8f9fa; 
        border-bottom: 1px solid #eee;
        font-size: 13px;
      }
      #parsePanel.show { display: block; }
      .parse-section { margin-bottom: 8px; }
      .parse-title { font-weight: 600; color: #333; margin-right: 8px; }
      .parse-tag { 
        display: inline-block; 
        padding: 2px 8px; 
        margin: 2px 4px 2px 0; 
        background: #e6f4ff; 
        border: 1px solid #91caff; 
        border-radius: 4px; 
        color: #1677ff;
        font-size: 12px;
      }
      .parse-tag.negative { background: #fff2f0; border-color: #ffccc7; color: #ff4d4f; }
      .parse-tag.constraint { background: #fff7e6; border-color: #ffd591; color: #fa8c16; }
      
      /* 权重条 */
      .weight-bar { 
        display: flex; 
        align-items: center; 
        gap: 12px;
        flex-wrap: wrap;
      }
      .weight-item { 
        display: flex; 
        align-items: center; 
        gap: 4px;
      }
      .weight-label { color: #666; font-size: 12px; }
      .weight-value { 
        display: inline-block;
        min-width: 60px;
        height: 8px;
        background: #e8e8e8;
        border-radius: 4px;
        overflow: hidden;
      }
      .weight-fill { 
        height: 100%; 
        background: linear-gradient(90deg, #1677ff, #69b1ff);
        border-radius: 4px;
      }
      .weight-pct { font-size: 12px; color: #1677ff; font-weight: 600; min-width: 36px; }
      
      /* 侧边栏 */
      .sidebar { 
        position: absolute; 
        right: 12px; 
        top: 120px; 
        width: 380px; 
        max-height: calc(100% - 132px); 
        overflow: auto; 
        background: #fff; 
        border: 1px solid #eee; 
        border-radius: 8px; 
        box-shadow: 0 6px 24px rgba(0,0,0,.08); 
        padding: 12px;
      }
      .sidebar h3 { margin: 0 0 10px 0; font-size: 15px; }
      
      /* 地块卡片 */
      .site-card { 
        border: 1px solid #f0f0f0; 
        border-radius: 8px; 
        padding: 10px; 
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .site-card:hover { border-color: #1677ff; box-shadow: 0 2px 8px rgba(22,119,255,0.15); }
      .site-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
      .site-name { font-weight: 600; font-size: 14px; color: #333; flex: 1; }
      .site-score { 
        background: #1677ff; 
        color: #fff; 
        padding: 2px 8px; 
        border-radius: 4px; 
        font-size: 13px;
        font-weight: 600;
      }
      
      /* 评分表格 */
      .score-table { 
        width: 100%; 
        border-collapse: collapse; 
        font-size: 12px; 
        margin: 8px 0;
      }
      .score-table th, .score-table td { 
        padding: 4px 6px; 
        text-align: center; 
        border: 1px solid #f0f0f0;
      }
      .score-table th { background: #fafafa; color: #666; font-weight: 500; }
      .score-table td { color: #333; }
      .score-table .highlight { color: #1677ff; font-weight: 600; }
      
      /* 优势风险分析 */
      .site-analysis { margin-top: 10px; }
      .analysis-section { margin-bottom: 8px; }
      .analysis-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
      .adv-title { color: #52c41a; }
      .risk-title { color: #ff4d4f; }
      .analysis-list { 
        margin: 0; 
        padding-left: 18px; 
        font-size: 12px; 
        line-height: 1.6;
      }
      .adv-list li { color: #389e0d; }
      .risk-list li { color: #cf1322; }
      .no-data { color: #999; font-size: 12px; }
      
      .hint { color: #999; font-size: 12px; }
      
      /* 周边详情按钮 */
      .poi-btn {
        margin-top: 8px;
        padding: 6px 12px;
        background: #f0f5ff;
        border: 1px solid #adc6ff;
        border-radius: 4px;
        color: #1677ff;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .poi-btn:hover { background: #e6f4ff; border-color: #1677ff; }

      /* 缓冲圈按钮组 */
      .buffer-btns {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .buffer-btn {
        padding: 4px 10px;
        background: #fff;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        color: #666;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .buffer-btn:hover { border-color: #1677ff; color: #1677ff; }
      .buffer-btn.active {
        background: #1677ff;
        border-color: #1677ff;
        color: #fff;
      }
      .buffer-btn-1km.active { background: #52c41a; border-color: #52c41a; }
      .buffer-btn-3km.active { background: #fa8c16; border-color: #fa8c16; }
      .buffer-btn-5km.active { background: #ff4d4f; border-color: #ff4d4f; }

      /* 缓冲圈图例 */
      .buffer-legend {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(255,255,255,0.95);
        padding: 10px 14px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        font-size: 12px;
        z-index: 100;
      }
      .buffer-legend-title {
        font-weight: 600;
        margin-bottom: 6px;
        color: #333;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .legend-color {
        width: 24px;
        height: 12px;
        border-radius: 2px;
      }
      .legend-1km { background: rgba(82, 196, 26, 0.25); border: 2px solid #52c41a; }
      .legend-3km { background: rgba(250, 140, 22, 0.2); border: 2px solid #fa8c16; }
      .legend-5km { background: rgba(255, 77, 79, 0.15); border: 2px solid #ff4d4f; }

      /* 满足条件清单 */
      .conditions-list {
        margin-top: 8px;
        padding: 8px 10px;
        background: #f6ffed;
        border: 1px solid #b7eb8f;
        border-radius: 4px;
        font-size: 12px;
      }
      .conditions-title {
        font-weight: 600;
        color: #52c41a;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .conditions-items {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .condition-tag {
        padding: 2px 8px;
        background: #fff;
        border: 1px solid #d9f7be;
        border-radius: 4px;
        color: #52c41a;
        font-size: 11px;
        white-space: nowrap;
      }
      .condition-tag.fail {
        background: #fff1f0;
        border-color: #ffccc7;
        color: #ff4d4f;
      }
      .condition-tag-label {
        color: #999;
        font-size: 11px;
        margin-right: 4px;
      }

      /* POI地图标记图例 */
      .poi-legend {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: rgba(255,255,255,0.95);
        padding: 10px 14px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        font-size: 12px;
        z-index: 101;
      }
      .poi-legend-title {
        font-weight: 600;
        margin-bottom: 6px;
        color: #333;
      }
      .poi-legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 3px;
        font-size: 11px;
      }
      .poi-icon {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 10px;
        font-weight: bold;
      }
      .poi-icon-subway { background: #1677ff; }
      .poi-icon-hospital { background: #ff4d4f; }
      .poi-icon-school { background: #52c41a; }
      .poi-icon-shop { background: #fa8c16; }
      .poi-icon-station { background: #9254de; }
      
      /* POI详情弹窗 */
      .poi-modal {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      }
      .poi-modal.show { display: flex; }
      .poi-content {
        background: #fff;
        border-radius: 12px;
        width: 90%;
        max-width: 700px;
        max-height: 80vh;
        overflow: auto;
        padding: 20px;
      }
      .poi-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #f0f0f0;
      }
      .poi-title { font-size: 16px; font-weight: 600; }
      .poi-close {
        width: 28px; height: 28px;
        border: none; background: #f5f5f5;
        border-radius: 50%; cursor: pointer;
        font-size: 16px; color: #666;
      }
      .poi-close:hover { background: #e8e8e8; }
      .poi-scores {
        display: flex; gap: 12px; flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .poi-score-item {
        padding: 8px 16px;
        background: #f6ffed;
        border: 1px solid #b7eb8f;
        border-radius: 6px;
        text-align: center;
      }
      .poi-score-label { font-size: 12px; color: #666; }
      .poi-score-value { font-size: 18px; font-weight: 600; color: #52c41a; }
      .poi-category {
        margin-bottom: 16px;
        border: 1px solid #f0f0f0;
        border-radius: 8px;
        overflow: hidden;
      }
      .poi-cat-header {
        background: #fafafa;
        padding: 10px 12px;
        font-weight: 600;
        font-size: 14px;
        border-bottom: 1px solid #f0f0f0;
      }
      .poi-cat-body { padding: 12px; }
      .poi-type-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px dashed #f0f0f0;
        font-size: 13px;
      }
      .poi-type-row:last-child { border-bottom: none; }
      .poi-type-name { color: #333; }
      .poi-type-stats { color: #1677ff; }
      .poi-items {
        margin-top: 8px;
        padding-left: 12px;
        font-size: 12px;
        color: #666;
      }
      .poi-item { padding: 2px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <input id="requirements" type="text" placeholder="请输入选址需求，例如：花都区食品生产厂，交通便利，价格适中" style="flex:1;min-width:300px" />
        <select id="city">
          <option value="guangzhou">广州</option>
        </select>
        <button id="runBtn">生成推荐</button>
        <input id="placeSearch" type="text" placeholder="搜索地名（如：广州塔）" style="width:180px" />
        <button id="searchBtn">搜索</button>
        <button id="clearBufferBtn" style="background:#52c41a;display:none;" onclick="clearAllBuffersBtn()">清除缓冲圈</button>
      </header>
      
      <!-- 需求解析面板 -->
      <div id="parsePanel">
        <div class="parse-section">
          <span class="parse-title">📋 需求拆解:</span>
          <span id="parsedReqs"></span>
        </div>
        <div class="parse-section">
          <span class="parse-title">⚖️ 指标权重:</span>
          <div class="weight-bar" id="weightBar"></div>
        </div>
      </div>

      <div id="map">
        <!-- 缓冲圈图例 -->
        <div class="buffer-legend" id="bufferLegend" style="display:none;">
          <div class="buffer-legend-title">📍 缓冲圈图例</div>
          <div class="legend-item">
            <div class="legend-color legend-1km"></div>
            <span>1km 生活圈</span>
          </div>
          <div class="legend-item">
            <div class="legend-color legend-3km"></div>
            <span>3km 通勤圈</span>
          </div>
          <div class="legend-item">
            <div class="legend-color legend-5km"></div>
            <span>5km 物流圈</span>
          </div>
        </div>
        <!-- POI标记图例 -->
        <div class="poi-legend" id="poiLegend" style="display:none;">
          <div class="poi-legend-title">🗺️ 周边设施</div>
          <div class="poi-legend-item">
            <div class="poi-icon poi-icon-subway">🚇</div>
            <span>地铁站</span>
          </div>
          <div class="poi-legend-item">
            <div class="poi-icon poi-icon-hospital">🏥</div>
            <span>医院</span>
          </div>
          <div class="poi-legend-item">
            <div class="poi-icon poi-icon-school">🎓</div>
            <span>学校</span>
          </div>
          <div class="poi-legend-item">
            <div class="poi-icon poi-icon-shop">🏪</div>
            <span>超市/餐饮</span>
          </div>
          <div class="poi-legend-item">
            <div class="poi-icon poi-icon-station">🚉</div>
            <span>火车站</span>
          </div>
          <button onclick="window.clearPOIMarkers()" style="margin-top:6px;padding:4px 8px;font-size:11px;cursor:pointer;background:#f5f5f5;border:1px solid #ddd;border-radius:3px;">清除标记</button>
        </div>
      </div>
    </div>
    
    <div class="sidebar" id="sidebar" hidden>
      <h3>🏆 推荐地块</h3>
      <div id="list"></div>
    </div>
    
    <!-- POI详情弹窗 -->
    <div class="poi-modal" id="poiModal">
      <div class="poi-content">
        <div class="poi-header">
          <span class="poi-title" id="poiTitle">周边详情</span>
          <button class="poi-close" onclick="closePoiModal()">×</button>
        </div>
        <div id="poiBody"></div>
      </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "rbush": "/static/lib/rbush/index.js"
      }
    }
    </script>

    <script type="module">
      import OlMap from '/static/lib/ol/Map.js';
      import View from '/static/lib/ol/View.js';
      import TileLayer from '/static/lib/ol/layer/Tile.js';
      import VectorLayer from '/static/lib/ol/layer/Vector.js';
      import XYZ from '/static/lib/ol/source/XYZ.js';
      import VectorSource from '/static/lib/ol/source/Vector.js';
      import {fromLonLat} from '/static/lib/ol/proj.js';
      import Feature from '/static/lib/ol/Feature.js';
      import Point from '/static/lib/ol/geom/Point.js';
      import Circle from '/static/lib/ol/geom/Circle.js';
      import Style from '/static/lib/ol/style/Style.js';
      import Fill from '/static/lib/ol/style/Fill.js';
      import Stroke from '/static/lib/ol/style/Stroke.js';
      import CircleStyle from '/static/lib/ol/style/Circle.js';

      let map = null;
      let vectorSource = null;
      let bufferSource = null;  // 缓冲圈数据源
      let poiSource = null;  // POI标记数据源
      let hasMap = false;
      let searchMarker = null;
      let currentPoiSiteId = null;  // 当前显示POI的地块ID
      // 存储当前显示的缓冲圈
      window.currentBufferFeatures = new Map();

      async function initMap() {
        vectorSource = new VectorSource();
        bufferSource = new VectorSource();
        poiSource = new VectorSource();
        try {
          const base = new TileLayer({
            source: new XYZ({ url: '/tiles/img/{z}/{x}/{y}', crossOrigin: 'anonymous' })
          });
          const labels = new TileLayer({
            source: new XYZ({ url: '/tiles/cia/{z}/{x}/{y}', crossOrigin: 'anonymous' })
          });
          const plotLayer = new VectorLayer({
            source: vectorSource,
            style: new Style({
              fill: new Fill({ color: 'rgba(22, 119, 255, 0.25)' }),
              stroke: new Stroke({ color: '#1677ff', width: 2 })
            })
          });
          // 缓冲圈图层
          const bufferLayer = new VectorLayer({
            source: bufferSource,
            style: function(feature) {
              const radius = feature.get('radius') || (feature.getGeometry() && feature.getGeometry().getRadius());
              const colors = {
                1000: { fill: 'rgba(82, 196, 26, 0.25)', stroke: '#52c41a' },
                3000: { fill: 'rgba(250, 140, 22, 0.2)', stroke: '#fa8c16' },
                5000: { fill: 'rgba(255, 77, 79, 0.15)', stroke: '#ff4d4f' }
              };
              const color = colors[radius] || { fill: 'rgba(22, 119, 255, 0.15)', stroke: '#1677ff' };
              return new Style({
                fill: new Fill({ color: color.fill }),
                stroke: new Stroke({ color: color.stroke, width: 2, lineDash: [8, 4] })
              });
            }
          });
          // POI标记图层
          const poiLayer = new VectorLayer({
            source: poiSource,
            style: function(feature) {
              const type = feature.get('poiType');
              const colors = {
                'subway': '#1677ff',
                'hospital': '#ff4d4f',
                'school': '#52c41a',
                'shop': '#fa8c16',
                'station': '#9254de'
              };
              const color = colors[type] || '#999';
              return new Style({
                image: new CircleStyle({ radius: 6, fill: new Fill({ color }), stroke: new Stroke({ color: '#fff', width: 2 }) })
              });
            }
          });
          map = new OlMap({
            target: 'map',
            layers: [base, labels, plotLayer, bufferLayer, poiLayer],
            view: new View({ center: fromLonLat([113.2644, 23.1291]), zoom: 12 })
          });
          hasMap = true;
        } catch (e) {
          console.warn('地图初始化失败：', e);
        }
      }
      initMap();

      function toFeat(f) {
        if (!hasMap) return null;
        const c = (f.geometry && f.geometry.coordinates) || [0, 0];
        const feat = new Feature({
          geometry: new Point(fromLonLat([c[0], c[1]])),
          properties: f.properties || {}
        });
        feat.setStyle(new Style({
          image: new CircleStyle({ radius: 8, fill: new Fill({ color: '#1677ff' }), stroke: new Stroke({ color: '#fff', width: 2 }) })
        }));
        return feat;
      }

      // 绘制圆形缓冲区
      function createBufferCircle(lon, lat, radiusMeters, siteId) {
        if (!hasMap) return null;
        const center = fromLonLat([lon, lat]);
        const circle = new Circle(center, radiusMeters);
        const feature = new Feature({
          geometry: circle,
          radius: radiusMeters,
          siteId: siteId
        });
        return feature;
      }

      // 切换缓冲区显示
      window.toggleBuffer = function(siteId, lon, lat, radius) {
        if (!bufferSource) return;
        const key = `${siteId}-${radius}`;
        const existingFeatures = window.currentBufferFeatures.get(key);

        if (existingFeatures) {
          // 移除缓冲区
          existingFeatures.forEach(f => bufferSource.removeFeature(f));
          window.currentBufferFeatures.delete(key);
          updateBufferButtons(siteId);
        } else {
          // 添加缓冲区
          const feature = createBufferCircle(lon, lat, radius, siteId);
          if (feature) {
            bufferSource.addFeature(feature);
            window.currentBufferFeatures.set(key, [feature]);
            updateBufferButtons(siteId);
          }
        }
      };

      // 清除某个地块的所有缓冲区
      window.clearSiteBuffers = function(siteId) {
        if (!bufferSource) return;
        for (const [key, features] of window.currentBufferFeatures.entries()) {
          if (key.startsWith(`${siteId}-`)) {
            features.forEach(f => bufferSource.removeFeature(f));
            window.currentBufferFeatures.delete(key);
          }
        }
        updateBufferButtons(siteId);
      };

      // 清除所有缓冲区
      window.clearAllBuffers = function() {
        if (bufferSource) {
          bufferSource.clear();
        }
        window.currentBufferFeatures.clear();
        // 更新所有缓冲区按钮状态
        document.querySelectorAll('.buffer-btn').forEach(btn => {
          if (btn) btn.classList.remove('active');
        });
      };

      // 更新缓冲区按钮状态
      function updateBufferButtons(siteId) {
        const radii = [1000, 3000, 5000];
        radii.forEach(radius => {
          const key = `${siteId}-${radius}`;
          const btn = document.querySelector(`.buffer-btn-${radius/1000}km[data-site="${siteId}"]`);
          if (btn) {
            if (window.currentBufferFeatures.has(key)) {
              btn.classList.add('active');
              btn.textContent = `隐藏${radius/1000}km圈`;
            } else {
              btn.classList.remove('active');
              btn.textContent = `${radius/1000}km圈`;
            }
          }
        });
      }

      // 清除所有缓冲区按钮
      window.clearAllBuffersBtn = function() {
        window.clearAllBuffers();
      };

      // 显示POI标记
      window.showPOIMarkers = async function(siteIndex, lon, lat) {
        if (!poiSource) return;

        // 清除之前的POI标记
        window.clearPOIMarkers();

        currentPoiSiteId = siteIndex;

        try {
          const resp = await fetch(`/api/poi_details/${siteIndex}`);
          if (!resp.ok) throw new Error('获取POI数据失败');
          const data = await resp.json();

          const poiDetails = data.poi_details || {};
          const typeMapping = {
            '地铁站': 'subway',
            '火车站': 'station',
            '高铁站': 'station',
            '医院': 'hospital',
            '高校': 'school',
            '中小学': 'school',
            '超市': 'shop',
            '购物中心': 'shop',
            '餐饮': 'shop'
          };

          let markerCount = 0;

          // 为每种POI类型添加标记
          for (const [cnName, type] of Object.entries(typeMapping)) {
            const category = poiDetails[cnName];
            if (category && category.items && Array.isArray(category.items)) {
              category.items.forEach(item => {
                if (item.location) {
                  try {
                    const [poiLon, poiLat] = item.location.split(',').map(s => parseFloat(s.trim()));
                    if (!isNaN(poiLon) && !isNaN(poiLat)) {
                      const feature = new Feature({
                        geometry: new Point(fromLonLat([poiLon, poiLat])),
                        poiType: type,
                        name: item.name || cnName
                      });
                      poiSource.addFeature(feature);
                      markerCount++;
                    }
                  } catch (e) {
                    console.warn('解析POI坐标失败:', item.location, e);
                  }
                }
              });
            }
          }

          console.log(`已添加 ${markerCount} 个POI标记`);
          document.getElementById('poiLegend').style.display = 'block';

          // 缩放地图以显示所有POI标记（安全模式）
          if (markerCount > 0 && hasMap) {
            try {
              const extent = poiSource.getExtent();
              // 验证extent有效性
              if (extent && extent.length === 4 &&
                  !extent.includes(Infinity) && !extent.includes(-Infinity) &&
                  !extent.includes(NaN)) {
                // 检查extent范围是否合理
                const extentWidth = extent[2] - extent[0];
                const extentHeight = extent[3] - extent[1];
                if (extentWidth > 0 && extentHeight > 0 && extentWidth < 360 && extentHeight < 180) {
                  map.getView().fit(extent, { padding: [50, 50, 50, 50], duration: 500, minResolution: 1 });
                }
              }
            } catch (fitError) {
              console.warn('地图缩放失败，保持当前视图:', fitError);
            }
          }
        } catch (e) {
          console.error('加载POI数据失败:', e);
          alert('加载POI数据失败: ' + e.message);
        }
      };

      // 清除POI标记
      window.clearPOIMarkers = function() {
        if (poiSource) {
          poiSource.clear();
        }
        currentPoiSiteId = null;
        const legend = document.getElementById('poiLegend');
        if (legend) legend.style.display = 'none';
      };

      // 填充满足条件清单
      window.populateConditionsLists = function(sites, parsedReqs) {
        if (!sites || !parsedReqs) return;

        const hardConstraints = parsedReqs.hard_constraints || [];
        const positive = parsedReqs.positive || [];
        const original = parsedReqs.original || '';

        // 为每个地块生成满足条件标签
        Object.values(sites).forEach(site => {
          const container = document.getElementById(`conditions-items-${site.site_index}`);
          if (!container) return;

          const conditions = [];
          const name = site.name || '';
          const scores = site.score_details || {};

          // 检查面积条件（从score_details.area.raw获取）
          const area = scores.area?.raw || 0;
          if (area > 0) {
            conditions.push(`✅ 面积${area >= 10000 ? (area/10000).toFixed(1) + '万㎡' : area.toFixed(0) + '㎡'}`);
          }

          // 检查区位/区域
          if (name && typeof name === 'string') {
            const districts = ['天河区', '海珠区', '越秀区', '荔湾区', '白云区', '番禺区', '黄埔区', '花都区', '南沙区', '增城区', '从化区'];
            for (const d of districts) {
              if (name.includes(d)) {
                conditions.push(`✅ ${d}`);
                break;
              }
            }
          }

          // 检查交通便利性
          if (scores.traffic && scores.traffic.normalized >= 6) {
            conditions.push(`✅ 交通便利(${scores.traffic.normalized.toFixed(1)}分)`);
          }

          // 检查区位评分
          if (scores.region && scores.region.normalized >= 7) {
            conditions.push(`✅ 区位优越(${scores.region.normalized.toFixed(1)}分)`);
          }

          // 检查性价比评分
          if (scores.price && scores.price.normalized >= 7) {
            conditions.push(`✅ 性价比高(${scores.price.normalized.toFixed(1)}分)`);
          }

          // 检查用户需求关键词
          if (original) {
            if ((original.includes('地铁') || original.includes('交通')) && scores.traffic && scores.traffic.normalized >= 5) {
              conditions.push(`✅ 满足交通要求`);
            }
            if (original.includes('大面积') && area >= 20000) {
              conditions.push(`✅ 大面积地块`);
            }
            if (original.includes('核心区') || original.includes('中心')) {
              const coreDistricts = ['天河区', '越秀区', '海珠区', '荔湾区'];
              for (const d of coreDistricts) {
                if (name && name.includes(d)) {
                  conditions.push(`✅ 核心城区`);
                  break;
                }
              }
            }
          }

          if (conditions.length === 0) {
            container.innerHTML = '<span class="condition-tag">暂无标签</span>';
          } else {
            container.innerHTML = conditions.map(c => `<span class="condition-tag">${c}</span>`).join('');
          }
        });
      };

      // 渲染需求解析面板
      function renderParsePanel(data) {
        const panel = document.getElementById('parsePanel');
        const parsedReqs = document.getElementById('parsedReqs');
        const weightBar = document.getElementById('weightBar');
        
        // 渲染子需求
        let reqsHtml = '';
        const pr = data.parsed_requirements || {};
        
        // 正向需求
        (pr.positive || []).forEach(r => {
          if (r) reqsHtml += `<span class="parse-tag">${r}</span>`;
        });
        
        // 负向需求
        (pr.negative || []).forEach(r => {
          if (r) reqsHtml += `<span class="parse-tag negative">排除: ${r}</span>`;
        });
        
        // 硬性约束（不展示）
        // (pr.hard_constraints || []).forEach(c => {
        //   if (c) reqsHtml += `<span class="parse-tag constraint">必须: ${c}</span>`;
        // });
        
        parsedReqs.innerHTML = reqsHtml || '<span class="hint">无法解析</span>';
        
        // 渲染权重条
        const weights = data.weights || {};
        let weightHtml = '';
        const weightOrder = ['traffic', 'price', 'area', 'region'];
        
        weightOrder.forEach(key => {
          const w = weights[key];
          if (w) {
            const pct = Math.round(w.value * 100);
            weightHtml += `
              <div class="weight-item">
                <span class="weight-label">${w.name}</span>
                <div class="weight-value"><div class="weight-fill" style="width:${pct}%"></div></div>
                <span class="weight-pct">${pct}%</span>
              </div>
            `;
          }
        });
        
        weightBar.innerHTML = weightHtml;
        panel.classList.add('show');
      }

      // 渲染地块列表（带评分表格）
      function renderList(sites, weights) {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const arr = Array.isArray(sites)
          ? sites
          : Object.keys(sites || {})
              .sort((a, b) => Number(a) - Number(b))
              .map(k => sites[k]);
        
        arr.forEach((s, i) => {
          const card = document.createElement('div');
          card.className = 'site-card';
          
          const score = s.score ? s.score.toFixed(2) : '-';
          const name = s.name || '未命名';
          const shortName = name.length > 25 ? name.substring(0, 25) + '...' : name;
          
          // 评分详情
          const sd = s.score_details || {};
          const traffic = sd.traffic || {};
          const price = sd.price || {};
          const area = sd.area || {};
          const region = sd.region || {};
          
          // 优势和风险（完整显示）
          const advList = Array.isArray(s.advantages) ? s.advantages : [];
          const riskList = Array.isArray(s.risks) ? s.risks : [];
          
          // 生成优势列表HTML
          let advHtml = '';
          if (advList.length > 0) {
            advHtml = '<ul class="analysis-list adv-list">' + advList.map(a => `<li>${a}</li>`).join('') + '</ul>';
          } else {
            advHtml = '<span class="no-data">暂无</span>';
          }
          
          // 生成风险列表HTML
          let riskHtml = '';
          if (riskList.length > 0) {
            riskHtml = '<ul class="analysis-list risk-list">' + riskList.map(r => `<li>${r}</li>`).join('') + '</ul>';
          } else {
            riskHtml = '<span class="no-data">暂无</span>';
          }
          
          card.innerHTML = `
            <div class="site-header">
              <div class="site-name">${i+1}. ${shortName}</div>
              <div class="site-score">${score}分</div>
            </div>
            <table class="score-table">
              <tr>
                <th>交通</th>
                <th>性价比</th>
                <th>面积</th>
                <th>区位</th>
              </tr>
              <tr>
                <td class="${traffic.normalized >= 6 ? 'highlight' : ''}">${traffic.desc || '-'}</td>
                <td>${price.desc || '-'}</td>
                <td>${area.desc || '-'}</td>
                <td class="${region.normalized >= 8 ? 'highlight' : ''}">${region.desc || '-'}</td>
              </tr>
            </table>
            <div class="site-analysis">
              <div class="analysis-section">
                <div class="analysis-title adv-title">✅ 优势</div>
                ${advHtml}
              </div>
              <div class="analysis-section">
                <div class="analysis-title risk-title">⚠️ 风险</div>
                ${riskHtml}
              </div>
            </div>
            <button class="poi-btn" onclick="showPoiDetails(${s.site_index}, '${shortName.replace(/'/g, "\\'")}')">📍 查看周边详情</button>
            <button class="poi-btn" onclick="showPOIMarkers(${s.site_index}, ${s.lon}, ${s.lat})">🗺️ 地图标记</button>
            <div class="buffer-btns">
              <button class="buffer-btn buffer-btn-1km" data-site="${s.site_index}" onclick="toggleBuffer(${s.site_index}, ${s.lon}, ${s.lat}, 1000)">1km圈</button>
              <button class="buffer-btn buffer-btn-3km" data-site="${s.site_index}" onclick="toggleBuffer(${s.site_index}, ${s.lon}, ${s.lat}, 3000)">3km圈</button>
              <button class="buffer-btn buffer-btn-5km" data-site="${s.site_index}" onclick="toggleBuffer(${s.site_index}, ${s.lon}, ${s.lat}, 5000)">5km圈</button>
            </div>
            <div class="conditions-list" id="conditions-${s.site_index}">
              <div class="conditions-title">✅ 满足条件</div>
              <div class="conditions-items" id="conditions-items-${s.site_index}">加载中...</div>
            </div>
          `;
          
          card.onclick = () => {
            if (hasMap && s.lon && s.lat) {
              map.getView().animate({ center: fromLonLat([+s.lon, +s.lat]), zoom: 15, duration: 400 });
            }
          };
          
          list.appendChild(card);
        });
        
        document.getElementById('sidebar').hidden = false;
      }

      async function run() {
        const btn = document.getElementById('runBtn');
        btn.disabled = true;
        btn.textContent = '生成中...';
        if (hasMap) vectorSource.clear();
        // 清除所有缓冲区
        window.clearAllBuffers();
        document.getElementById('bufferLegend').style.display = 'none';
        document.getElementById('clearBufferBtn').style.display = 'none';
        
        // 隐藏之前的结果
        document.getElementById('parsePanel').classList.remove('show');
        document.getElementById('sidebar').hidden = true;

        const payload = {
          requirements: document.getElementById('requirements').value,
          city: document.getElementById('city').value,
          top_k: 5,  // 推荐5个地块
          type: 'zh'
        };

        try {
          const resp = await fetch('/api/recommendations', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(payload) 
          });
          const data = await resp.json();
          
          if (data.error) throw new Error(data.error);
          
          // 渲染需求解析面板
          renderParsePanel(data);
          
          // 渲染地图标记
          if (hasMap) {
            (data.features || []).forEach(f => { 
              const feat = toFeat(f); 
              if (feat) vectorSource.addFeature(feat); 
            });
            if (data.center) { 
              map.getView().animate({ center: fromLonLat([data.center.lon, data.center.lat]), zoom: 12, duration: 300 }); 
            }
          }
          
          // 渲染地块列表
          if (data.sites) {
            renderList(data.sites, data.weights);
            // 填充满足条件清单
            window.populateConditionsLists(data.sites, data.parsed_requirements);
            // 显示缓冲区图例和清除按钮
            document.getElementById('bufferLegend').style.display = 'block';
            document.getElementById('clearBufferBtn').style.display = 'block';
          }
          
        } catch (e) {
          alert('服务错误: ' + e.message);
        } finally {
          btn.disabled = false; 
          btn.textContent = '生成推荐';
        }
      }

      // 将run函数暴露到window对象上
      window.run = run;
      document.getElementById('runBtn').onclick = run;
      document.getElementById('requirements').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') run();
      });

      // 地名搜索
      async function searchPlace() {
        const q = document.getElementById('placeSearch').value.trim();
        if (!q) return;
        const city = document.getElementById('city').value === 'guangzhou' ? '广州' : '';
        try {
          const resp = await fetch(`/api/geocode?q=${encodeURIComponent(q)}&city=${encodeURIComponent(city)}`);
          const r = await resp.json();
          if (!resp.ok || r.error) {
            alert('未找到匹配地点');
            return;
          }
          const lon = parseFloat(r.lon), lat = parseFloat(r.lat);
          if (hasMap) {
            if (searchMarker) vectorSource.removeFeature(searchMarker);
            const feat = new Feature({ geometry: new Point(fromLonLat([lon, lat])) });
            feat.setStyle(new Style({ 
              image: new CircleStyle({ radius: 10, fill: new Fill({ color: '#ff4d4f' }), stroke: new Stroke({ color: '#fff', width: 2 }) }) 
            }));
            vectorSource.addFeature(feat);
            searchMarker = feat;
            map.getView().animate({ center: fromLonLat([lon, lat]), zoom: 15, duration: 400 });
          }
        } catch (e) {
          alert('搜索失败：' + e.message);
        }
      }
      
      document.getElementById('searchBtn').onclick = searchPlace;
      document.getElementById('placeSearch').addEventListener('keydown', (e) => { 
        if (e.key === 'Enter') searchPlace(); 
      });
      
      // POI详情功能
      window.showPoiDetails = async function(siteIndex, siteName) {
        const modal = document.getElementById('poiModal');
        const title = document.getElementById('poiTitle');
        const body = document.getElementById('poiBody');
        
        title.textContent = `📍 ${siteName} - 周边详情`;
        body.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">加载中...</div>';
        modal.classList.add('show');
        
        try {
          const resp = await fetch(`/api/poi_details/${siteIndex}`);
          if (!resp.ok) throw new Error('获取失败');
          const data = await resp.json();
          
          // 渲染评分
          const scores = data.scores || {};
          let scoresHtml = '<div class="poi-scores">';
          const scoreLabels = {交通: '🚇', 生活: '🏪', 教育: '🎓', 产业: '🏭', 商业: '🏢'};
          for (const [k, v] of Object.entries(scores)) {
            scoresHtml += `<div class="poi-score-item"><div class="poi-score-label">${scoreLabels[k] || ''} ${k}</div><div class="poi-score-value">${v.toFixed(1)}</div></div>`;
          }
          scoresHtml += '</div>';
          
          // 按类别分组POI
          const details = data.poi_details || {};
          const categories = {
            '交通设施': ['地铁站', '公交站', '停车场', '火车站', '高速出入口'],
            '生活配套': ['银行', '超市', '餐饮', '医院', '药店'],
            '教育资源': ['高校', '中小学'],
            '产业配套': ['物流园', '工业园'],
            '商业环境': ['写字楼', '酒店']
          };
          
          let categoriesHtml = '';
          for (const [catName, types] of Object.entries(categories)) {
            let typesHtml = '';
            for (const t of types) {
              const info = details[t];
              if (!info) continue;
              const count = info.count || 0;
              const minDist = info.min_distance;
              const radius = info.radius || 0;
              const distStr = minDist ? `最近${minDist}m` : '无';
              
              typesHtml += `<div class="poi-type-row">
                <span class="poi-type-name">${t} (${radius/1000}km内)</span>
                <span class="poi-type-stats">${count}个 | ${distStr}</span>
              </div>`;
              
              // 显示前3个POI名称
              const items = info.items || [];
              if (items.length > 0) {
                typesHtml += '<div class="poi-items">';
                items.slice(0, 3).forEach(item => {
                  typesHtml += `<div class="poi-item">• ${item.name}${item.distance ? ` (${item.distance}m)` : ''}</div>`;
                });
                if (items.length > 3) typesHtml += `<div class="poi-item" style="color:#999;">...还有${items.length - 3}个</div>`;
                typesHtml += '</div>';
              }
            }
            
            if (typesHtml) {
              categoriesHtml += `<div class="poi-category">
                <div class="poi-cat-header">${catName}</div>
                <div class="poi-cat-body">${typesHtml}</div>
              </div>`;
            }
          }
          
          body.innerHTML = scoresHtml + categoriesHtml;
          
        } catch (e) {
          body.innerHTML = `<div style="text-align:center;padding:40px;color:#ff4d4f;">加载失败: ${e.message}</div>`;
        }
      };
      
      window.closePoiModal = function() {
        document.getElementById('poiModal').classList.remove('show');
      };
      
      // 点击弹窗外部关闭
      document.getElementById('poiModal').addEventListener('click', function(e) {
        if (e.target === this) closePoiModal();
      });
    </script>
  </body>
</html>
