<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智能选址推荐 - 地图展示</title>
    <link rel="stylesheet" href="/static/lib/ol/ol.css" />
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
      .wrap { display: flex; flex-direction: column; height: 100%; }
      #map { flex: 1; min-height: 0; }
      header { padding: 10px 12px; border-bottom: 1px solid #eee; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      header input, header select { padding: 6px; border: 1px solid #ddd; border-radius: 6px; }
      header button { padding: 6px 10px; border: none; background: #1677ff; color: #fff; border-radius: 6px; cursor: pointer; }
      header button:disabled { background: #9db9ff; cursor: not-allowed; }
      
      /* 需求解析面板 */
      #parsePanel { 
        display: none; 
        padding: 10px 12px; 
        background: #f8f9fa; 
        border-bottom: 1px solid #eee;
        font-size: 13px;
      }
      #parsePanel.show { display: block; }
      .parse-section { margin-bottom: 8px; }
      .parse-title { font-weight: 600; color: #333; margin-right: 8px; }
      .parse-tag { 
        display: inline-block; 
        padding: 2px 8px; 
        margin: 2px 4px 2px 0; 
        background: #e6f4ff; 
        border: 1px solid #91caff; 
        border-radius: 4px; 
        color: #1677ff;
        font-size: 12px;
      }
      .parse-tag.negative { background: #fff2f0; border-color: #ffccc7; color: #ff4d4f; }
      .parse-tag.constraint { background: #fff7e6; border-color: #ffd591; color: #fa8c16; }
      
      /* 权重条 */
      .weight-bar { 
        display: flex; 
        align-items: center; 
        gap: 12px;
        flex-wrap: wrap;
      }
      .weight-item { 
        display: flex; 
        align-items: center; 
        gap: 4px;
      }
      .weight-label { color: #666; font-size: 12px; }
      .weight-value { 
        display: inline-block;
        min-width: 60px;
        height: 8px;
        background: #e8e8e8;
        border-radius: 4px;
        overflow: hidden;
      }
      .weight-fill { 
        height: 100%; 
        background: linear-gradient(90deg, #1677ff, #69b1ff);
        border-radius: 4px;
      }
      .weight-pct { font-size: 12px; color: #1677ff; font-weight: 600; min-width: 36px; }
      
      /* 侧边栏 */
      .sidebar { 
        position: absolute; 
        right: 12px; 
        top: 120px; 
        width: 380px; 
        max-height: calc(100% - 132px); 
        overflow: auto; 
        background: #fff; 
        border: 1px solid #eee; 
        border-radius: 8px; 
        box-shadow: 0 6px 24px rgba(0,0,0,.08); 
        padding: 12px;
      }
      .sidebar h3 { margin: 0 0 10px 0; font-size: 15px; }
      
      /* 地块卡片 */
      .site-card { 
        border: 1px solid #f0f0f0; 
        border-radius: 8px; 
        padding: 10px; 
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .site-card:hover { border-color: #1677ff; box-shadow: 0 2px 8px rgba(22,119,255,0.15); }
      .site-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
      .site-name { font-weight: 600; font-size: 14px; color: #333; flex: 1; }
      .site-score { 
        background: #1677ff; 
        color: #fff; 
        padding: 2px 8px; 
        border-radius: 4px; 
        font-size: 13px;
        font-weight: 600;
      }
      
      /* 评分表格 */
      .score-table { 
        width: 100%; 
        border-collapse: collapse; 
        font-size: 12px; 
        margin: 8px 0;
      }
      .score-table th, .score-table td { 
        padding: 4px 6px; 
        text-align: center; 
        border: 1px solid #f0f0f0;
      }
      .score-table th { background: #fafafa; color: #666; font-weight: 500; }
      .score-table td { color: #333; }
      .score-table .highlight { color: #1677ff; font-weight: 600; }
      
      /* 优势风险分析 */
      .site-analysis { margin-top: 10px; }
      .analysis-section { margin-bottom: 8px; }
      .analysis-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
      .adv-title { color: #52c41a; }
      .risk-title { color: #ff4d4f; }
      .analysis-list { 
        margin: 0; 
        padding-left: 18px; 
        font-size: 12px; 
        line-height: 1.6;
      }
      .adv-list li { color: #389e0d; }
      .risk-list li { color: #cf1322; }
      .no-data { color: #999; font-size: 12px; }
      
      .hint { color: #999; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <input id="requirements" type="text" placeholder="请输入选址需求，例如：花都区食品生产厂，交通便利，价格适中" style="flex:1;min-width:300px" />
        <select id="city">
          <option value="guangzhou">广州</option>
        </select>
        <button id="runBtn">生成推荐</button>
        <input id="placeSearch" type="text" placeholder="搜索地名（如：广州塔）" style="width:180px" />
        <button id="searchBtn">搜索</button>
      </header>
      
      <!-- 需求解析面板 -->
      <div id="parsePanel">
        <div class="parse-section">
          <span class="parse-title">📋 需求拆解:</span>
          <span id="parsedReqs"></span>
        </div>
        <div class="parse-section">
          <span class="parse-title">⚖️ 指标权重:</span>
          <div class="weight-bar" id="weightBar"></div>
        </div>
      </div>
      
      <div id="map"></div>
    </div>
    
    <div class="sidebar" id="sidebar" hidden>
      <h3>🏆 推荐地块</h3>
      <div id="list"></div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "rbush": "/static/lib/rbush/index.js"
      }
    }
    </script>

    <script type="module">
      import Map from '/static/lib/ol/Map.js';
      import View from '/static/lib/ol/View.js';
      import TileLayer from '/static/lib/ol/layer/Tile.js';
      import VectorLayer from '/static/lib/ol/layer/Vector.js';
      import XYZ from '/static/lib/ol/source/XYZ.js';
      import VectorSource from '/static/lib/ol/source/Vector.js';
      import {fromLonLat} from '/static/lib/ol/proj.js';
      import Feature from '/static/lib/ol/Feature.js';
      import Point from '/static/lib/ol/geom/Point.js';
      import Style from '/static/lib/ol/style/Style.js';
      import Fill from '/static/lib/ol/style/Fill.js';
      import Stroke from '/static/lib/ol/style/Stroke.js';
      import CircleStyle from '/static/lib/ol/style/Circle.js';

      let map = null;
      let vectorSource = null;
      let hasMap = false;
      let searchMarker = null;

      async function initMap() {
        vectorSource = new VectorSource();
        try {
          const base = new TileLayer({ 
            source: new XYZ({ url: '/tiles/img/{z}/{x}/{y}', crossOrigin: 'anonymous' })
          });
          const labels = new TileLayer({ 
            source: new XYZ({ url: '/tiles/cia/{z}/{x}/{y}', crossOrigin: 'anonymous' }) 
          });
          const plotLayer = new VectorLayer({
            source: vectorSource,
            style: new Style({
              fill: new Fill({ color: 'rgba(22, 119, 255, 0.25)' }),
              stroke: new Stroke({ color: '#1677ff', width: 2 })
            })
          });
          map = new Map({
            target: 'map',
            layers: [base, labels, plotLayer],
            view: new View({ center: fromLonLat([113.2644, 23.1291]), zoom: 12 })
          });
          hasMap = true;
        } catch (e) {
          console.warn('地图初始化失败：', e);
        }
      }
      initMap();

      function toFeat(f) {
        if (!hasMap) return null;
        const c = (f.geometry && f.geometry.coordinates) || [0, 0];
        const feat = new Feature({
          geometry: new Point(fromLonLat([c[0], c[1]])),
          properties: f.properties || {}
        });
        feat.setStyle(new Style({
          image: new CircleStyle({ radius: 8, fill: new Fill({ color: '#1677ff' }), stroke: new Stroke({ color: '#fff', width: 2 }) })
        }));
        return feat;
      }

      // 渲染需求解析面板
      function renderParsePanel(data) {
        const panel = document.getElementById('parsePanel');
        const parsedReqs = document.getElementById('parsedReqs');
        const weightBar = document.getElementById('weightBar');
        
        // 渲染子需求
        let reqsHtml = '';
        const pr = data.parsed_requirements || {};
        
        // 正向需求
        (pr.positive || []).forEach(r => {
          if (r) reqsHtml += `<span class="parse-tag">${r}</span>`;
        });
        
        // 负向需求
        (pr.negative || []).forEach(r => {
          if (r) reqsHtml += `<span class="parse-tag negative">排除: ${r}</span>`;
        });
        
        // 硬性约束（不展示）
        // (pr.hard_constraints || []).forEach(c => {
        //   if (c) reqsHtml += `<span class="parse-tag constraint">必须: ${c}</span>`;
        // });
        
        parsedReqs.innerHTML = reqsHtml || '<span class="hint">无法解析</span>';
        
        // 渲染权重条
        const weights = data.weights || {};
        let weightHtml = '';
        const weightOrder = ['traffic', 'price', 'area', 'region'];
        
        weightOrder.forEach(key => {
          const w = weights[key];
          if (w) {
            const pct = Math.round(w.value * 100);
            weightHtml += `
              <div class="weight-item">
                <span class="weight-label">${w.name}</span>
                <div class="weight-value"><div class="weight-fill" style="width:${pct}%"></div></div>
                <span class="weight-pct">${pct}%</span>
              </div>
            `;
          }
        });
        
        weightBar.innerHTML = weightHtml;
        panel.classList.add('show');
      }

      // 渲染地块列表（带评分表格）
      function renderList(sites, weights) {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const arr = Array.isArray(sites)
          ? sites
          : Object.keys(sites || {})
              .sort((a, b) => Number(a) - Number(b))
              .map(k => sites[k]);
        
        arr.forEach((s, i) => {
          const card = document.createElement('div');
          card.className = 'site-card';
          
          const score = s.score ? s.score.toFixed(2) : '-';
          const name = s.name || '未命名';
          const shortName = name.length > 25 ? name.substring(0, 25) + '...' : name;
          
          // 评分详情
          const sd = s.score_details || {};
          const traffic = sd.traffic || {};
          const price = sd.price || {};
          const area = sd.area || {};
          const region = sd.region || {};
          
          // 优势和风险（完整显示）
          const advList = Array.isArray(s.advantages) ? s.advantages : [];
          const riskList = Array.isArray(s.risks) ? s.risks : [];
          
          // 生成优势列表HTML
          let advHtml = '';
          if (advList.length > 0) {
            advHtml = '<ul class="analysis-list adv-list">' + advList.map(a => `<li>${a}</li>`).join('') + '</ul>';
          } else {
            advHtml = '<span class="no-data">暂无</span>';
          }
          
          // 生成风险列表HTML
          let riskHtml = '';
          if (riskList.length > 0) {
            riskHtml = '<ul class="analysis-list risk-list">' + riskList.map(r => `<li>${r}</li>`).join('') + '</ul>';
          } else {
            riskHtml = '<span class="no-data">暂无</span>';
          }
          
          card.innerHTML = `
            <div class="site-header">
              <div class="site-name">${i+1}. ${shortName}</div>
              <div class="site-score">${score}分</div>
            </div>
            <table class="score-table">
              <tr>
                <th>交通</th>
                <th>性价比</th>
                <th>面积</th>
                <th>区位</th>
              </tr>
              <tr>
                <td class="${traffic.normalized >= 6 ? 'highlight' : ''}">${traffic.desc || '-'}</td>
                <td>${price.desc || '-'}</td>
                <td>${area.desc || '-'}</td>
                <td class="${region.normalized >= 8 ? 'highlight' : ''}">${region.desc || '-'}</td>
              </tr>
            </table>
            <div class="site-analysis">
              <div class="analysis-section">
                <div class="analysis-title adv-title">✅ 优势</div>
                ${advHtml}
              </div>
              <div class="analysis-section">
                <div class="analysis-title risk-title">⚠️ 风险</div>
                ${riskHtml}
              </div>
            </div>
          `;
          
          card.onclick = () => {
            if (hasMap && s.lon && s.lat) {
              map.getView().animate({ center: fromLonLat([+s.lon, +s.lat]), zoom: 15, duration: 400 });
            }
          };
          
          list.appendChild(card);
        });
        
        document.getElementById('sidebar').hidden = false;
      }

      async function run() {
        const btn = document.getElementById('runBtn');
        btn.disabled = true; 
        btn.textContent = '生成中...';
        if (hasMap) vectorSource.clear();
        
        // 隐藏之前的结果
        document.getElementById('parsePanel').classList.remove('show');
        document.getElementById('sidebar').hidden = true;

        const payload = {
          requirements: document.getElementById('requirements').value,
          city: document.getElementById('city').value,
          top_k: 10,
          type: 'zh'
        };

        try {
          const resp = await fetch('/api/recommendations', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(payload) 
          });
          const data = await resp.json();
          
          if (data.error) throw new Error(data.error);
          
          // 渲染需求解析面板
          renderParsePanel(data);
          
          // 渲染地图标记
          if (hasMap) {
            (data.features || []).forEach(f => { 
              const feat = toFeat(f); 
              if (feat) vectorSource.addFeature(feat); 
            });
            if (data.center) { 
              map.getView().animate({ center: fromLonLat([data.center.lon, data.center.lat]), zoom: 12, duration: 300 }); 
            }
          }
          
          // 渲染地块列表
          if (data.sites) {
            renderList(data.sites, data.weights);
          }
          
        } catch (e) {
          alert('服务错误: ' + e.message);
        } finally {
          btn.disabled = false; 
          btn.textContent = '生成推荐';
        }
      }

      document.getElementById('runBtn').onclick = run;
      document.getElementById('requirements').addEventListener('keydown', (e) => { 
        if (e.key === 'Enter') run(); 
      });

      // 地名搜索
      async function searchPlace() {
        const q = document.getElementById('placeSearch').value.trim();
        if (!q) return;
        const city = document.getElementById('city').value === 'guangzhou' ? '广州' : '';
        try {
          const resp = await fetch(`/api/geocode?q=${encodeURIComponent(q)}&city=${encodeURIComponent(city)}`);
          const r = await resp.json();
          if (!resp.ok || r.error) {
            alert('未找到匹配地点');
            return;
          }
          const lon = parseFloat(r.lon), lat = parseFloat(r.lat);
          if (hasMap) {
            if (searchMarker) vectorSource.removeFeature(searchMarker);
            const feat = new Feature({ geometry: new Point(fromLonLat([lon, lat])) });
            feat.setStyle(new Style({ 
              image: new CircleStyle({ radius: 10, fill: new Fill({ color: '#ff4d4f' }), stroke: new Stroke({ color: '#fff', width: 2 }) }) 
            }));
            vectorSource.addFeature(feat);
            searchMarker = feat;
            map.getView().animate({ center: fromLonLat([lon, lat]), zoom: 15, duration: 400 });
          }
        } catch (e) {
          alert('搜索失败：' + e.message);
        }
      }
      
      document.getElementById('searchBtn').onclick = searchPlace;
      document.getElementById('placeSearch').addEventListener('keydown', (e) => { 
        if (e.key === 'Enter') searchPlace(); 
      });
    </script>
  </body>
</html>
